  <!-- Manifest -->

        href="./manifest.webmanifest">

  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Disiplin SKAM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  

<script>
  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;
  });

  async function installAplikasi() {
    // iPhone atau iPad
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    if (isIOS) {
      alert(
        "CARA INSTALL APLIKASI DI iPHONE\n\n" +
        "1. Buka pautan ini menggunakan Safari.\n" +
        "2. Tekan butang Kongsi (Share).\n" +
        "3. Pilih Add to Home Screen / Tambah ke Skrin Utama.\n" +
        "4. Tekan Add / Tambah.\n\n" +
        "Ikon Disiplin SKAM akan muncul pada skrin utama."
      );
      return;
    }

    // Chrome atau pelayar yang menawarkan pemasangan terus
    if (deferredPrompt) {
      const promptEvent = deferredPrompt;
      deferredPrompt = null;

      await promptEvent.prompt();
      await promptEvent.userChoice;
      return;
    }

    // Pelayar lain atau aplikasi sudah dipasang
    alert(
      "Pemasangan terus tidak tersedia buat masa ini.\n\n" +
      "Jika menggunakan Chrome Android:\n" +
      "1. Tekan menu tiga titik (⋮).\n" +
      "2. Pilih Install app atau Add to Home screen.\n" +
      "3. Ikut arahan pemasangan.\n\n" +
      "Jika aplikasi sudah dipasang, tidak perlu memasangnya semula."
    );
  }

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
  });
</script>
