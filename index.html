
<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Sistem Rekod Disiplin SKAM</title>

  <!-- Ikon aplikasi iPhone -->
  <link rel="apple-touch-icon"
        href="./icon-192.png?v=3">

  <!-- Ikon aplikasi -->
  <link rel="icon"
        type="image/png"
        href="./icon-192.png?v=3">

  <!-- Manifest -->
  <link rel="manifest"
        href="./manifest.webmanifest">

  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Disiplin SKAM">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  
<script>
  let deferredPrompt = null;

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    deferredPrompt = event;

    const btn = document.getElementById("installBtn");
    if (btn) {
      btn.style.display = "block";
    }
  });

  async function installAplikasi() {
    if (!deferredPrompt) {
      alert(
        "Pemasangan terus tidak tersedia pada pelayar ini. " +
        "Gunakan menu pelayar untuk memasang aplikasi."
      );
      return;
    }

    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;

    document.getElementById("installBtn").style.display = "none";
  }

  window.addEventListener("appinstalled", function () {
    deferredPrompt = null;
    const btn = document.getElementById("installBtn");
    if (btn) btn.style.display = "none";
  });
</script>



  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;

    .kotak {

      height: 110px;

    }

    h2 {
      color: #1e3a5f;
    }

    a {
      display: block;
      background: #1e3a5f;

      padding: 15px;
      margin-top: 25px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="kotak">

    
<img
  src="./icon-512.png"

<button
  id="installBtn"
  type="button"
  onclick="installAplikasi()"
  style="
